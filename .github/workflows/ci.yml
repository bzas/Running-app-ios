name: iOS Build & Test (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: iOS build & test with coverage
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.app

      - name: Resolve dependencies
        run: xcodebuild -scheme Running-app-ios -resolvePackageDependencies

      - name: Build
        run: >
          xcodebuild
          -scheme Running-app-ios
          -destination "platform=iOS Simulator,OS=26.1,name=iPhone 17 Pro"
          -configuration Debug
          clean build

      - name: Test
        run: >
          xcodebuild
          -scheme Running-app-ios
          -destination "platform=iOS Simulator,OS=26.1,name=iPhone 17 Pro"
          -configuration Debug
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          test

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults.xcresult
          flags: ios
          fail_ci_if_error: true

      - name: Upload test results (coverage + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
